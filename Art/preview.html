<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mod preview composition</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 896px; height: 504px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; }
.art, .veil { position: absolute; inset: 0; width: 100%; height: 100%; }
.art { object-fit: cover; }
.copy { position: absolute; left: var(--left); top: var(--top); text-shadow: var(--shadow); }
h1 { font-size: var(--title-size); font-weight: 600; line-height: 1.1; letter-spacing: 0; width: var(--title-width); text-wrap: balance; color: var(--inkPrimary); }
h1 > .title-link, h1 > .title-suffix { font-size: .65em; }
h1 > .title-suffix { color: var(--inkSecondary); }
.tag { width: max-content; margin-top: 8px; font-size: 24px; font-weight: 400; line-height: 1.1; letter-spacing: .2px; color: var(--inkSecondary); }
.rule { width: 58px; height: 3px; background: var(--accent); margin-top: 20px; margin-bottom: 16px; }
.summary { width: 430px; font-size: 21px; font-weight: 400; line-height: 1.45; letter-spacing: 0; color: var(--inkPrimary); }
.badge { position: absolute; right: 0; top: 0; width: 80px; height: 80px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%); }
.version { position: absolute; left: 869px; top: 27px; transform: translate(-50%, -50%) rotate(45deg); font-size: 26px; font-weight: 700; line-height: 1; color: var(--badgeInk); text-shadow: none; }
</style>
<img class="art" alt="Winged beast above dusty ground and red firecrackers">
<div class="veil"></div>
<main class="copy"><h1></h1><p class="tag"></p><div class="rule"></div><p class="summary"></p></main>
<div class="badge"></div><span class="version"></span>
<script>
window.previewReady = (async () => {
  const [palette, layout] = await Promise.all(['preview-palette.json','preview-layout.json'].map(p => fetch(p).then(r => r.json())));
  const about = new DOMParser().parseFromString(await fetch(layout.about).then(r => r.text()), 'application/xml');
  if (about.querySelector('parsererror')) throw new Error('Invalid About.xml');
  const name = about.querySelector('ModMetaData > name').textContent;
  const tag = name.match(/\s*(\((?:unofficial|prohibited)\))$/)?.[1] || '';
  const versions = [...about.querySelectorAll('supportedVersions > li')].map(e => e.textContent.trim()).filter(v => /^\d+\.\d+(?:\.\d+)*$/.test(v));
  versions.sort((a,b) => { const aa=a.split('.').map(Number), bb=b.split('.').map(Number); for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(bb[i]||0)-(aa[i]||0);if(d)return d;} return 0; });
  if (!versions.length) throw new Error('No stable supported version');
  const style = document.documentElement.style;
  for (const [k,v] of Object.entries(palette)) { if(!/^#[0-9A-F]{6}$/i.test(v))throw new Error('Invalid palette'); style.setProperty('--'+k,v); }
  for (const [k,v] of Object.entries({'left':layout.textLeft,'top':layout.textTop,'title-size':layout.titleSize,'title-width':layout.titleWidth})) style.setProperty('--'+k,v+'px');
  style.setProperty('--shadow',layout.veilMode === 'dark' ? '0 3px 10px rgba(0,0,0,.75)' : 'none');
  const rgb = palette.veil.match(/[0-9a-f]{2}/gi).map(v=>parseInt(v,16)).join(',');
  document.querySelector('.veil').style.background = `radial-gradient(circle at top left, rgba(${rgb},${layout.veilStartOpacity}) 0%, rgba(${rgb},${layout.veilHoldOpacity}) ${layout.veilHoldPercent}%, rgba(${rgb},0) ${layout.veilFadePercent}%)`;
  const title = tag ? name.slice(0, name.lastIndexOf(tag)).trim() : name;
  const heading = document.querySelector('h1');
  for (const token of title.split(/(\s+)/)) {
    if (/^\s+$/.test(token)) { heading.append(document.createTextNode(token)); continue; }
    const span = document.createElement('span');
    span.textContent = token;
    span.className = layout.titleAffixes.includes(token) ? 'title-suffix' : layout.titleConnectors.includes(token) ? 'title-link' : 'title-strong';
    heading.append(span);
  }
  if(heading.textContent !== title) throw new Error('Title text changed');
  const tagNode = document.querySelector('.tag'); tagNode.textContent = tag; tagNode.hidden = !tag;
  document.querySelector('.summary').textContent = layout.summary;
  document.querySelector('.version').textContent = versions[0];
  const img = document.querySelector('.art'); img.src = layout.source; await img.decode();
  await document.fonts.ready;
  return { name, tag, version: versions[0], palette, layout };
})();
</script>
</html>
