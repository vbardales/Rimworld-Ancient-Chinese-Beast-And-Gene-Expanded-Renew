:root{--veil:#35312D;--inkPrimary:#F2ECE1;--inkSecondary:#F5CF97;--accent:#EF4936;--badgeInk:#17120E;--iconOutline:var(--accent)}*{margin:0;padding:0;box-sizing:border-box}
html,body{width:896px;height:504px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}

body{background:url(Preview.png) center/cover}
@property --lueur{syntax:'<percentage>';inherits:false;initial-value:24%}

.panel-bottom-left{inset:auto auto 0 0;padding:20px 3rem;border-radius:0 2rem 0 0;border-width:1px 1px 0 0}
.panel-bottom-right{inset:auto 0 0 auto;padding:20px 3rem;border-radius:2rem 0 0 0;border-width:1px 0 0 1px}
.panel-top-right{inset:0 0 auto auto;border-radius:0 0 0 2rem;border-width:0 0 1px 1px}
